version: '3.8'

services:
  # Quarkus Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Port removed - only accessible internally through middleware
    # This prevents direct external access to the backend API
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=${NEON_DB_URL}
      - QUARKUS_DATASOURCE_USERNAME=${NEON_DB_USER}
      - QUARKUS_DATASOURCE_PASSWORD=${NEON_DB_PASSWORD}
      - QUARKUS_HTTP_PORT=8080
      - CORS_ORIGINS=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - oppex-network

  # Node.js Middleware
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    # Port removed - only accessible internally through frontend nginx proxy
    # This prevents direct external access to middleware endpoints
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - QUARKUS_URL=http://backend:8080
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - oppex-network

  # React Frontend (for production build serving)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - middleware
    restart: unless-stopped
    networks:
      - oppex-network

networks:
  oppex-network:
    driver: bridge
